# Prose linting for the family documentation site (plan §7).
#
# The site is EN-only by decision, which removes the usual excuse for not
# linting the English: there is no second language to keep in step and no
# translator in the loop. Vale is the only objective gate on it.
#
# Scope: the hand-written sections only. `docs/src/api/**` is generated from
# docblocks — a prose linter there produces findings whose only fix is
# rewriting PHP docblocks to satisfy a Microsoft style rule, and that volume
# would bury the real findings on the first run. The scope is enforced by the
# paths passed on the command line, not here; see `make docs-vale` and
# .github/workflows/docs.yml.
#
# The rule set is Microsoft's, minus the rules that contradict the house style
# this documentation already has. Each exclusion is a decision, not a way to
# make the run green — do not add to the list to silence a finding that is
# simply correct.

StylesPath = docs/.vale/styles
MinAlertLevel = warning
# Pinned to a release URL, not the bare `Microsoft` alias: the alias resolves
# to whatever upstream serves that morning, and this gate sits at zero
# findings — one new warning-level rule would redden master with no local
# change. The binary is version- and checksum-pinned in
# .github/workflows/docs.yml for the same reason; pinning one and floating the
# other is not a policy.
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip
Vocab = Understudy

[*.md]
BasedOnStyles = Vale, Microsoft

# Spaced em dashes are this documentation's main punctuation for an aside —
# like this one. Microsoft's guide forbids them outright; changing them into
# commas and parentheses would flatten the prose, not improve it.
Microsoft.Dashes = NO

# Microsoft prefers contractions ("don't", "isn't"). These docs are written in
# the same register as the AGENTS.md files next to them, which spell out
# "do not". Consistency with the surrounding corpus beats the style guide.
Microsoft.Contractions = NO

# Flags every -ly adverb. "Silently", "deliberately" and "exactly" are
# load-bearing words here: they distinguish a failure mode that is reported
# from one that is not.
Microsoft.Adverbs = NO

# Wants the word after a colon in a heading capitalized. Our headings put code
# after the colon, and capitalizing an identifier makes it a different
# identifier.
Microsoft.HeadingColons = NO

# American punctuation-inside-quotes. Wrong for a documentation set that
# quotes exact strings — moving the period inside "Directory not empty"
# changes the value being discussed.
Microsoft.Quotes = NO

# "CI", "PHPUnit" and "API" in a heading are clearer than their expansions.
Microsoft.HeadingAcronyms = NO

# Question headings ("Has everything been described?") are the clearest form
# for a rationale section, and the rule cannot tell them from a stray period.
Microsoft.HeadingPunctuation = NO
