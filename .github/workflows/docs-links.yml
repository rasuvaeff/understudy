name: docs links

# External links rot without anyone touching this repository, so this runs on
# a schedule as well as on the pull requests that add them.
#
# Deliberately NOT a step inside docs.yml: its verdict depends on somebody
# else's host being up. A documentation deploy must not be blocked because
# php.net had a bad minute, and a red run here must be readable as "a link
# died", not "the docs are broken".
on:
  pull_request:
    paths:
      - 'docs/src/**/*.md'
      - 'docs/scripts/check-links.mjs'
      - '.github/workflows/docs-links.yml'
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: External links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks only the pages it changed, which needs the
          # base commit to diff against. Unconditional rather than an
          # `x && 0 || 1` expression: GitHub treats 0 as falsy, so that idiom
          # silently yields 1 in both branches.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      # On a pull request: only the changed pages, unless the checker itself
      # changed, in which case everything. On a schedule: everything.
      - name: Select pages
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "pages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA")

          if echo "$changed" | grep -qx 'docs/scripts/check-links.mjs'; then
            echo "pages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pages=$(echo "$changed" | grep -E '^docs/src/.*\.md$' | tr '\n' ' ')
          echo "pages=$pages" >> "$GITHUB_OUTPUT"

      # $PAGES unquoted on purpose: it is a space-separated list of paths, and
      # it reaches the shell through the environment rather than through
      # template expansion — a filename in a fork's pull request must never
      # become part of this command line.
      - name: Check external links
        env:
          PAGES: ${{ steps.select.outputs.pages }}
        run: node docs/scripts/check-links.mjs $PAGES
